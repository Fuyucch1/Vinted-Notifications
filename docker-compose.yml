services:
  vinted-notifications:
    build: .
    image: vinted-notifications:local
    ports:
      - "9005:8000"
      - "8080:8080"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  VN_data:
  VN_logs:
